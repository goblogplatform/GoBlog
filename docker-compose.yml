# goblog with SQLite: one container, one volume. Everything goblog writes
# (.env, the database, uploads, installed plugins and themes) lives in the
# goblog-data volume, so `docker compose pull && docker compose up -d`
# upgrades without losing the site.
#
#   docker compose up -d
#   docker compose logs goblog | grep "setup code"
#
# then open http://localhost:7000 and follow the install wizard.
services:
  goblog:
    image: compscidr/goblog:latest
    # To run what is checked out here instead of the released image:
    # build: .
    restart: unless-stopped
    environment:
      GOBLOG_DATA_DIR: /data
    ports:
      - "7000:7000"
    volumes:
      - goblog-data:/data

  # PostgreSQL instead of SQLite: uncomment this service and the volume
  # below, run `docker compose up -d`, and in the install wizard choose
  # PostgreSQL with host "postgres", user and database "goblog" and the
  # password set here. MySQL works the same way with the mysql:9 image.
  # postgres:
  #   image: postgres:16-alpine
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_DB: goblog
  #     POSTGRES_USER: goblog
  #     POSTGRES_PASSWORD: change-me
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

volumes:
  goblog-data:
  # postgres-data:
