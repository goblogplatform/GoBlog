<html>
<head>
    <title>Goblog Install Wizard</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.8/css/bootstrap.min.css" integrity="sha512-2bBQCjcnw658Lho4nlXJcc6WkV/UxpE/sAokbXPxQNGqmNdQrWqtw26Ns9kFF/yG792pKR1Sx8/Y1Lf1XN4GKA==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-social/5.1.1/bootstrap-social.min.css" integrity="sha512-f8mUMCRNrJxPBDzPJx3n+Y5TC5xp6SmStstEfgsDXZJTcxBakoB5hvPLhAfJKa9rCvH+n3xpJ2vQByxLk4WP2g==" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" />
    <link rel="stylesheet" href="/css/wizard.css"/>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/twitter-bootstrap/5.3.8/js/bootstrap.min.js" integrity="sha512-nKXmKvJyiGQy343jatQlzDprflyB5c+tKCzGP3Uq67v+lmzfnZUi/ZT+fc6ITZfSC5HhaBKUIvr/nTLCV+7F+Q==" crossorigin="anonymous"></script>
    <script defer src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous"></script>
</head>
<body>
<script defer src="/js/admin-script.js"></script>
<div class="container">
    <div class="card border-0 shadow my-5">
        <div class="card-body p-5" style="min-height: 600px;">
            <h1 class="fw-light">Goblog Install Wizard</h1>
            <div id="ajax-error" class="alert alert-danger" role="alert" style="display: none;"></div>
            <h5>Goblog Settings</h5>
            {{ if .errors }}
            <div class="alert alert-danger" role="alert">
                {{ .errors }}
            </div>
            {{ end }}
            <form id="settings-form" enctype="multipart/form-data">
                <div class="mb-4 row">
                    <div class="col">
                        <label for="site_title" class="form-label">Site Title:</label>
                        <input type="text" class="form-control" id="site_title" name="site_title" value="My Blog">
                    </div>
                    <div class="col">
                        <label for="site_subtitle" class="form-label">Site Subtitle:</label>
                        <input type="text" class="form-control" id="site_subtitle" name="site_subtitle" value="" placeholder="A short tagline">
                    </div>
                </div>
                <div class="mb-4 row">
                    <div class="col">
                        <label for="site_logo_letters" class="form-label">Site Logo Letters:</label>
                        <input type="text" class="form-control" id="site_logo_letters" name="site_logo_letters" value="MB">
                    </div>
                    <div class="col">
                        <label for="site_tags" class="form-label">Site Tags:</label>
                        <input type="text" class="form-control" id="site_tags" name="site_tags" value="" placeholder="Comma-separated topics, e.g. travel, cooking">
                    </div>
                </div>
                <div class="mb-4 row">
                    <div class="col">
                        <label for="landing_page_image" class="form-label">Landing Page Image (should be square):</label>
                        <input type="file" class="form-control" id="landing_page_image" name="landing_page_image" oninput="uploadFile(this)">
                    </div>
                    <div class="col">
                        <label for="favicon" class="form-label">Favicon:</label>
                        <input type="file" class="form-control" id="favicon" name="favicon" oninput="uploadFile(this)">
                    </div>
                </div>
                <a class="btn btn-primary mt-2" onclick="updateSettings('/wizard?page=auth');">
                    Save Settings
                </a>
            </form>
            <div class="version text-center">{{ template "_powered_by" . }}</div>
        </div>
    </div>
</div>
</body>
</html>
